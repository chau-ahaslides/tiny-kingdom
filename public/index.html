<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Join a game</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light dark; --ink: #20303f; --card: #fff; --bg: #cfe8ff; --blue: #4a8fe7; --line: #d8e0ea; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ececea; --card: #1f2023; --bg: #17181a; --line: #3a3d44; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Fredoka, system-ui, sans-serif; }
  .center { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: var(--card); border-radius: 24px; padding: 28px 28px 24px; box-shadow: 0 10px 40px rgba(0,0,0,.18); max-width: 420px; width: 100%; text-align: center; }
  h1 { margin: 0 0 6px; font-size: 28px; } p { margin: 0 0 18px; opacity: .8; line-height: 1.4; }
  form { display: flex; flex-direction: column; gap: 12px; }
  input { font-family: inherit; font-size: 34px; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; text-align: center; padding: 12px 8px; border: 2px solid var(--line); border-radius: 16px; width: 100%; background: transparent; color: inherit; }
  input:focus { outline: none; border-color: var(--blue); }
  button { font-family: inherit; font-weight: 700; font-size: 20px; border: 0; border-radius: 16px; padding: 14px 20px; cursor: pointer; background: var(--blue); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  button:disabled { opacity: .5; cursor: default; box-shadow: none; }
  .err { color: #e5533d; font-size: 14px; min-height: 18px; margin: 0; }
  .foot { margin-top: 18px; font-size: 12px; opacity: .55; } .foot a { color: inherit; }
</style>
</head>
<body>
<div class="center"><form class="card" id="f" autocomplete="off">
  <h1>🎮 Join a game</h1>
  <p>Enter the code shown on the big screen.</p>
  <input id="code" inputmode="latin" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="8" placeholder="CODE" autofocus>
  <button id="go" type="submit" disabled>Join</button>
  <p class="err" id="err"></p>
  <div class="foot">Or scan the QR code on the screen · <a href="https://games.ahaslides.io/catalog">all games</a></div>
</form></div>
<script>
'use strict';
const input = document.getElementById('code'), go = document.getElementById('go'), err = document.getElementById('err');
const clean = () => input.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 8);
input.addEventListener('input', () => { input.value = clean(); go.disabled = input.value.length < 4; err.textContent = ''; });
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault(); const code = clean(); if (code.length < 4) return;
  go.disabled = true; go.textContent = 'Joining…';
  location.href = '/j/' + code;          // the room directory sends the phone on to the game's page, or back here if the code is unknown
});
const qs = new URLSearchParams(location.search); const q = qs.get('code');
if (q) { input.value = q.replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 8); go.disabled = input.value.length < 4; }
if (qs.has('missing')) { err.textContent = 'No game is open with that code. Check the big screen and try again.'; history.replaceState(null, '', '/'); }
</script>
</body>
</html>
